[project]
name = "mtv-agent"
version = "0.2.2"
description = "AI agent for MTV/Forklift VM migrations"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "openai",
    "mcp",
    "pydantic-settings",
    "httpx",
    "pyyaml",
    "sse-starlette",
    "textual>=4.0",
]

[project.urls]
Homepage = "https://github.com/kubev2v/mtv-agent"
Repository = "https://github.com/kubev2v/mtv-agent"
Issues = "https://github.com/kubev2v/mtv-agent/issues"

[project.scripts]
mtv-agent = "mtv_agent.cli:main"
mtv-server = "mtv_agent.server.app:main"
mtv-tui = "mtv_agent.tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtv_agent"]

[dependency-groups]
dev = ["ruff", "pytest", "pytest-asyncio"]
